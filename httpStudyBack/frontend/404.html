<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - 페이지를 찾을 수 없습니다</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap");

      body {
        background-color: #f0f2f5;
        color: #333;
        font-family: "Montserrat", sans-serif;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
      }

      .container {
        max-width: 600px;
        padding: 20px;
      }

      .error-code {
        font-size: 150px;
        font-weight: 700;
        color: #4a90e2;
        margin: 0;
        animation: bounce 1s infinite;
      }

      @keyframes bounce {
        0%,
        20%,
        50%,
        80%,
        100% {
          transform: translateY(0);
        }
        40% {
          transform: translateY(-30px);
        }
        60% {
          transform: translateY(-15px);
        }
      }

      .message {
        font-size: 24px;
        font-weight: 700;
        margin-top: 0;
        margin-bottom: 20px;
      }

      .sub-message {
        font-size: 16px;
        color: #666;
        margin-bottom: 30px;
      }

      .home-button {
        display: inline-block;
        background-color: #4a90e2;
        color: #fff;
        padding: 12px 24px;
        border-radius: 50px;
        text-decoration: none;
        font-weight: 700;
        transition: background-color 0.3s ease, transform 0.2s ease;
      }

      .home-button:hover {
        background-color: #357abd;
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="error-code">404</h1>
      <p class="message">페이지를 찾을 수 없습니다</p>
      <p class="sub-message">요청하신 페이지가 사라졌거나, 잘못된 주소를 입력하셨어요.</p>
      <a href="/" class="home-button">홈으로 돌아가기</a>
    </div>
  </body>
</html>
